<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>bench fixture — getmit-style</title>
<style>
  body { font-family: system-ui, sans-serif; background: #20211f; color: #eee; margin: 0; padding: 16px; }
  .bench-banner { font-size: 12px; opacity: 0.6; margin-bottom: 8px; }
  #game-container { width: max-content; }
  .board { background: #3a3b38; border-radius: 6px; padding: 10px; display: grid; grid-template-columns: repeat(4, 100px); grid-gap: 10px; }
  .cell { width: 100px; height: 100px; background: #55564f; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; color: #fff; }
</style>
</head>
<body>
  <div class="bench-banner">playkit bench fixture — GetMIT-style rows/cells board (tiles as .cell-x-y classes)</div>
  <div id="game-container" data-game-input>
    <div class="board"></div>
  </div>
  <div id="score">0</div>

  <script>
    window.__createFixtureGame = async function ({ seed, scenario }) {
      const { FixtureGame } = await import("./game-engine.js");
      const boardEl = document.querySelector("#game-container .board");
      const scoreEl = document.getElementById("score");
      const cells = [];
      // GetMIT-style: 4 row divs, each with 4 cells carrying 1-based cell-COL-ROW
      // classes (a position pattern the GetMIT adapter's parser supports).
      for (let r = 0; r < 4; r++) {
        const row = document.createElement("div");
        row.className = "board-row";
        row.style.display = "contents";
        for (let c = 0; c < 4; c++) {
          const cell = document.createElement("div");
          cell.className = `cell cell-${c + 1}-${r + 1}`;
          row.appendChild(cell);
          cells.push(cell);
        }
        boardEl.appendChild(row);
      }

      const game = new FixtureGame({
        seed,
        scenario,
        onRender(state) {
          for (let i = 0; i < 16; i++) {
            const r = Math.floor(i / 4);
            const c = i % 4;
            const v = state.board[r][c];
            cells[i].textContent = v ? String(v) : "";
          }
          scoreEl.textContent = String(state.score);
        },
      });
      game.onVanish = () => document.getElementById("game-container").remove();
      return game;
    };
  </script>
  <script type="module" src="./bootstrap.js"></script>
</body>
</html>
