<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>playkit benchmark runner</title>
<style>
  body { font-family: system-ui, sans-serif; background: #101418; color: #e6e6e6; margin: 0; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #9aa4b2; font-size: 13px; margin-bottom: 16px; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
  button:disabled { background: #334; cursor: default; }
  button.ghost { background: #1e2733; }
  #status { font-size: 13px; color: #9aa4b2; margin: 12px 0; min-height: 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #1e2733; vertical-align: top; }
  th { color: #9aa4b2; font-weight: 500; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .dot.idle { background: #475569; }
  .dot.running { background: #f59e0b; }
  .dot.ok { background: #22c55e; }
  .dot.fail { background: #ef4444; }
  code { color: #93c5fd; font-size: 12px; }
  #summary { margin-top: 16px; font-size: 14px; }
  .note { color: #9aa4b2; }
</style>
</head>
<body>
  <h1>playkit runtime benchmark</h1>
  <div class="sub">
    Drives fixture pages in iframes through the real adapters / runtime / driver,
    Layer 2 (src) and Layer 3 (built bundle). Full methodology in
    <code>bench/README.md</code>.
  </div>
  <button id="run-all">Run all scenarios</button>
  <button id="save" class="ghost">Save results JSON</button>
  <div id="status"></div>
  <table id="results">
    <thead>
      <tr><th>Scenario</th><th>Fixture</th><th>Inputs → moves</th><th>Parity</th><th>Solver</th><th>Detail</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <div id="summary"></div>

  <script type="module">
    import { SCENARIOS, runScenario } from "./harness.js";

    const tbody = document.querySelector("#results tbody");
    const statusEl = document.getElementById("status");
    const summaryEl = document.getElementById("summary");
    const runAll = document.getElementById("run-all");
    const saveBtn = document.getElementById("save");
    let latestResults = [];

    const rows = new Map();
    for (const spec of SCENARIOS) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><span class="dot idle"></span>${spec.id}</td>
        <td>${spec.fixture}<br /><code>${JSON.stringify(spec.params || {})}</code></td>
        <td class="io">—</td>
        <td class="parity">—</td>
        <td class="solver">—</td>
        <td class="detail note">—</td>`;
      tbody.appendChild(tr);
      rows.set(spec.id, tr);
    }

    function setRow(id, state) {
      const tr = rows.get(id);
      const dot = tr.querySelector(".dot");
      dot.className = `dot ${state}`;
    }

    function fillRow(id, result) {
      const tr = rows.get(id);
      const a = result.metrics.afterPresses || result.metrics.afterTouches ||
        result.metrics.afterVanish || result.metrics.afterSwap || result.metrics.afterAutostart || {};
      tr.querySelector(".io").textContent = `${a.inputCount ?? "?"} → ${a.moveCount ?? "?"}`;
      tr.querySelector(".parity").textContent =
        result.metrics.parity === true ? "match" : result.metrics.parity === false ? "MISMATCH" : "n/a";
      tr.querySelector(".solver").textContent =
        result.metrics.moveOrderMs != null
          ? `${result.metrics.moveOrderMs}ms`
          : result.metrics.moveOrderError || "—";
      tr.querySelector(".detail").textContent =
        (result.error ? `ERROR: ${result.error}` : result.notes.join(" · ")) || "—";
    }

    runAll.addEventListener("click", async () => {
      runAll.disabled = true;
      latestResults = [];
      for (const spec of SCENARIOS) {
        setRow(spec.id, "running");
        statusEl.textContent = `running ${spec.id}…`;
        const result = await runScenario(spec, {
          onStatus: (line) => {
            statusEl.textContent = line;
          },
        });
        latestResults.push(result);
        setRow(spec.id, result.ok ? (result.metrics.parity === false ? "fail" : "ok") : "fail");
        fillRow(spec.id, result);
      }
      statusEl.textContent = "done";
      const mismatches = latestResults.filter((r) => r.ok && r.metrics.parity === false).length;
      const failures = latestResults.filter((r) => !r.ok).length;
      summaryEl.textContent = `${latestResults.length} scenarios — ${failures} errors, ${mismatches} parity mismatches. window.__BENCH_RESULTS__ holds the full JSON.`;
      window.__BENCH_RESULTS__ = latestResults;
      runAll.disabled = false;
    });

    saveBtn.addEventListener("click", async () => {
      if (!latestResults.length) {
        statusEl.textContent = "nothing to save yet";
        return;
      }
      await fetch("/api/results", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          savedAt: new Date().toISOString(),
          userAgent: navigator.userAgent,
          results: latestResults,
        }),
      });
      statusEl.textContent = "saved to bench/results/last-run.json";
    });
  </script>
</body>
</html>
