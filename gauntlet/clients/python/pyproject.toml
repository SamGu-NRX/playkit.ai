[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "playkit-gauntlet"
version = "0.1.0"
description = "Python client for the PlayKit Gauntlet wire protocol (standard library only)."
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
# The Inspect AI adapter (playkit_gauntlet.inspect_task). The client itself
# keeps zero dependencies; install with `pip install ".[inspect]"`.
inspect = ["inspect_ai>=0.3.0"]

[tool.setuptools]
packages = ["playkit_gauntlet"]
